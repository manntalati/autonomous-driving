# Phase 7 — unified perception demo (detection + segmentation + BEV).

data_root: data/raw/v1.0-mini
scene: scene-1100          # nuScenes scene the demo runs on
seq_len: 3                 # temporal detector window

# trained models — each entry is (its training config, its checkpoint)
detector:
  config: configs/temporal.yaml
  checkpoint: checkpoints/temporal_best.pt
segmenter:
  config: configs/segmenter_hybrid.yaml
  checkpoint: checkpoints/segmenter_hybrid_best.pt
bev:
  # Phase-8 surround model: trained on 6 cameras + seg + LiDAR depth.
  # The demo passes only CAM_FRONT (N=1) so the BEV map is meaningful in the
  # front portion; the back stays mostly background — that matches what a
  # forward-camera-only system can see.
  config: configs/bev_surround.yaml
  checkpoint: checkpoints/bev_surround_best.pt

# display / decode thresholds
det_score_threshold: 0.3
bev_score_threshold: 0.3
bev_max_detections: 50
